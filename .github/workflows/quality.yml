name: Quality Gate

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

  windows-build:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Add Visual C++ runtime libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $visualStudio) {
            throw "Visual Studio with the C++ toolchain was not found."
          }

          $crtDirectory = Get-ChildItem `
            -Path "$visualStudio\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" `
            -Directory |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $crtDirectory) {
            throw "The redistributable Visual C++ runtime was not found."
          }

          Copy-Item `
            -Path "$($crtDirectory.FullName)\*.dll" `
            -Destination "build/windows/x64/runner/Release" `
            -Force

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: mirascope-windows-0.1.0+1-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
